# XcodeGen spec — run `xcodegen generate` after editing.
# The .xcodeproj is generated and disposable; this file is the source of truth.
name: CodexCast
options:
  bundleIdPrefix: app.ckg
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

packages:
  CodexCastKit:
    path: Packages/CodexCastKit

targets:
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ckg.codexcast.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YFJ5Q82C77
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

  CodexCast:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - target: ShareExtension
      - package: CodexCastKit
        products:
          - CodexCastCore
          - CodexCastPersistence
          - CodexCastFeeds
          - CodexCastPlayback
          - CodexCastTranscription
          - CodexCastPipeline
          - CodexCastDetection
          - CodexCastDetectionAFM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ckg.codexcast
        INFOPLIST_FILE: App/Info.plist
        # CarPlay Audio (com.apple.developer.carplay-audio). Granted on the
        # App ID by Apple; signing fails outright without that grant, which is
        # why this arrived only once the request came back approved.
        CODE_SIGN_ENTITLEMENTS: CodexCast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YFJ5Q82C77
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
