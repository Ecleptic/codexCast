# XcodeGen spec — run `xcodegen generate` after editing.
# The .xcodeproj is generated and disposable; this file is the source of truth.
name: CodexCast
options:
  bundleIdPrefix: app.ckg
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

packages:
  CodexCastKit:
    path: Packages/CodexCastKit

targets:
  CodexCast:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: CodexCastKit
        products:
          - CodexCastCore
          - CodexCastPersistence
          - CodexCastFeeds
          - CodexCastPlayback
          - CodexCastTranscription
          - CodexCastPipeline
          - CodexCastDetection
          - CodexCastDetectionAFM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ckg.codexcast
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YFJ5Q82C77
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
